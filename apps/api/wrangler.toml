name = "bazaar-guide-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Secret (never in this file): npx wrangler secret put HYPIXEL_KEY

# Cache only (profiles 1 h, Mojang lookups 1 day). Create once:
#   npx wrangler kv namespace create CACHE
# then paste the printed id below.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 10 requests per 60 s per IP (the binding only allows periods of 10 or 60 s).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
