<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player figure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Your character with armor" style="position: relative; width: {{w}}; height: {{h}};">
  <sc-for list="{{parts}}" as="p" hint-placeholder-count="14">
    <div style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: {{p.w}}; height: {{p.h}}; background: {{p.c}}; box-shadow: {{p.s}};"></div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"helmetColor":{"editor":"color","default":"#5CC8FF"},"chestColor":{"editor":"color","default":"#5CC8FF"},"legsColor":{"editor":"color","default":"#3A9BD6"},"bootsColor":{"editor":"color","default":"#5CC8FF"},"scale":{"editor":"float","default":1,"min":0.3,"max":2,"step":0.1},"$preview":{"width":112,"height":224}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.scale ?? 1;
    const hc = this.props.helmetColor ?? '#5CC8FF';
    const cc = this.props.chestColor ?? '#5CC8FF';
    const lc = this.props.legsColor ?? '#3A9BD6';
    const bc = this.props.bootsColor ?? '#5CC8FF';
    const skin = '#C79B78', edge = 'inset 0 0 0 ' + Math.max(1, 2 * k).toFixed(1) + 'px rgba(0,0,0,0.28)';
    const r = (x, y, w, h, c, s) => ({ x: x * k + 'px', y: y * k + 'px', w: w * k + 'px', h: h * k + 'px', c, s: s ? edge : 'none' });
    const parts = [
      r(28, 0, 56, 56, skin, true),
      r(38, 28, 9, 8, '#24222B'), r(65, 28, 9, 8, '#24222B'),
      r(25, -3, 62, 24, hc, true), r(25, 21, 8, 24, hc, true), r(79, 21, 8, 24, hc, true),
      r(28, 56, 56, 84, cc, true),
      r(0, 56, 28, 50, cc, true), r(84, 56, 28, 50, cc, true),
      r(0, 106, 28, 34, skin, true), r(84, 106, 28, 34, skin, true),
      r(28, 140, 28, 60, lc, true), r(56, 140, 28, 60, lc, true),
      r(26, 200, 30, 24, bc, true), r(56, 200, 30, 24, bc, true)
    ];
    return { parts, w: 112 * k + 'px', h: 224 * k + 'px' };
  }
}
</script>
</body>
</html>
